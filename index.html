<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gui Me Yeu</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffafbd,#ffc3a0);font-family:sans-serif}
.card{background:#fff;width:85%;max-width:380px;padding:30px 20px;border-radius:30px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.2)}
.btn{background:#ff6b9a;color:#fff;border:none;padding:14px 28px;border-radius:30px;font-size:17px}
</style>
</head>
<body>
<div class="card">
<div style="font-size:50px">💖</div>
<h1 style="color:#8a2a4a">Chuc Mung 20/10</h1>
<h2 style="color:#e91e63">Gui Me Yeu</h2>
<p>Cam on me da luon yeu thuong con! Chuc me manh khoe, vui ve!</p>
<button class="btn" id="btnNhac">Bam vao day co nhac ne me 💕</button>
<p id="loi" style="display:none;color:#e91e63;font-weight:bold;margin-top:15px">Con yeu me nhieu lam! ❤️<br><span style="font-size:13px;color:#888">🎶 Nhac Piano du duong dang phat...</span></p>
<audio id="nhac" loop preload="auto" playsinline>
<source src="https://ia800905.m.archive.org/35/items/MoonlightSonata_201506/Moonlight%20Sonata.mp3" type="audio/mpeg">
</audio>
</div>
<script>
document.getElementById('btnNhac').addEventListener('click', function(){
 var nhac = document.getElementById('nhac');
 nhac.volume = 1.0;
 nhac.play().then(()=>{
   this.innerHTML = '🎶 Dang phat nhac...';
   document.getElementById('loi').style.display='block';
 }).catch(e=>{
   alert('Ban hay bat loa to len nhe! Trinh duyet vua chan nhac, ban bam OK roi bam lai nut 1 lan nua nhe!');
 });
});
</script>
</body>
</html>
