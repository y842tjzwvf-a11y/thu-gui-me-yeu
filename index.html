<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gui Me Yeu</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#ffafbd,#ffc3a0);font-family:sans-serif}
.card{background:#fff;width:86%;max-width:380px;padding:30px 20px;border-radius:30px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.2)}
.btn{background:#ff6b9a;color:#fff;border:none;padding:14px 28px;border-radius:30px;font-size:18px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<div style="font-size:55px">💖</div>
<h1 style="color:#8a2a4a;margin:10px 0">Chuc Mung 20/10</h1>
<h2 style="color:#e91e63;margin:5px 0">Gui Me Yeu</h2>
<p>Cam on me da luon yeu thuong con! Chuc me manh khoe, vui ve!</p>
<button class="btn" onclick="playMusic()">Bam vao day co nhac ne me 💕</button>
<p id="loi" style="display:none;color:#e91e63;font-weight:bold;margin-top:18px;font-size:18px">Con yeu me nhieu lam! ❤️<br><span style="font-size:14px">🎶 Nhac yeu thuong dang phat...</span></p>
</div>
<script>
let ctx;
function playMusic(){
 document.getElementById('loi').style.display='block';
 if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
 const notes=[261.63,329.63,392.00,523.25,392.00,329.63,261.63,329.63,392.00,523.25,659.25,523.25,392.00];
 let t=ctx.currentTime;
 notes.forEach((f,i)=>{
  let o=ctx.createOscillator(); let g=ctx.createGain();
  o.frequency.value=f; o.type='sine'; o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.3,t); g.gain.exponentialRampToValueAtTime(0.01,t+0.6);
  o.start(t); o.stop(t+0.6); t+=0.35;
 });
 // lap lai
 setTimeout(()=>{if(document.getElementById('loi').style.display==='block') playMusic()}, 5000);
 this.event.target.innerText='🎶 Dang phat nhac...';
}
</script>
</body>
</html>
