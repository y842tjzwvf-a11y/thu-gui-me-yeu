<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mẹ 20/10</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(#ffafbd,#ffc3a0);font-family:sans-serif}
.card{background:white;width:85%;max-width:380px;padding:35px 22px;border-radius:28px;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.15)}
h1{color:#8a2a4a;font-size:28px;margin:15px 0 10px;line-height:1.3}
h1 span{display:block;color:#e91e63;font-size:18px;margin-top:6px}
p{color:#7a3a4e;font-size:16px;line-height:1.6}
.btn{background:#ff6b9a;color:white;border:none;padding:14px 28px;border-radius:30px;font-size:16px;margin-top:20px;box-shadow:0 5px 15px rgba(255,107,154,.4)}
</style>
</head>
<body>
<div class="card">
<div style="font-size:50px">💖</div>
<h1>Chúc Mừng 20/10<span>Ngày Phụ Nữ Việt Nam</span></h1>
<h1 style="font-size:26px;margin-top:5px">Gửi mẹ yêu của con</h1>
<p>Cảm ơn mẹ đã luôn yêu thương, chăm sóc và hy sinh cho con.<br>Con yêu mẹ nhiều hơn tất cả!</p>
<p><b>Chúc mẹ luôn mạnh khỏe, vui vẻ và hạnh phúc mỗi ngày!</b></p>
<button class="btn" onclick="playNhac()">Nhấn vào đây nè mẹ 💌</button>
<p id="loi" style="display:none;margin-top:20px;color:#e91e63;font-weight:bold">🎵 Con chúc mẹ 20/10 thật vui vẻ, luôn cười tươi mẹ nhé! Yêu mẹ! ❤️<br><br>🌸🌸🌸</p>
<audio id="nhac" loop><source src="https://cdn.pixabay.com/audio/2023/01/audio_816821e627.mp3" type="audio/mpeg"></audio>
</div>
<script>
function playNhac(){
  document.getElementById('nhac').play();
  document.getElementById('loi').style.display='block';
  // tim bay
  for(let i=0;i<20;i++){let s=document.createElement('div');s.innerHTML='💖';s.style.position='fixed';s.style.left=Math.random()*100+'vw';s.style.top='-20px';s.style.fontSize='20px';s.style.animation='roi 3s linear';document.body.appendChild(s)}
}
let style=document.createElement('style');style.innerHTML='@keyframes roi{to{transform:translateY(110vh) rotate(360deg)}}';document.head.appendChild(style);
</script>
</body>
</html>
